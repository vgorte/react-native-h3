name: ✨ Feature request
description: Suggest an H3 operation, API addition, or change in behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or use case behind your request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
      description: Describe the API or behaviour you would like to see. An example is helpful if you have one.
      render: typescript
    validations:
      required: true

  - type: input
    id: h3-js-equivalent
    attributes:
      label: h3-js equivalent
      description: >
        If this operation exists in h3-js, what is its name? The package mirrors the h3-js surface,
        so a matching name is a parity gap, while a new one is an additive API.
      placeholder: "cellsToMultiPolygon, or: none"

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How do you solve this today, if at all?

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
