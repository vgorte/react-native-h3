name: 🐛 Bug report
description: An H3 operation returns the wrong result, crashes, or the package fails to build.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Wrong results and build failures both belong here. For a build failure, the full log matters
        more than anything else in this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
      placeholder: |
        polygonToCells returns an empty BigUint64Array for a polygon that crosses the antimeridian.
        h3-js returns 4,214 cells for the same polygon.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest piece of code that shows it, with real coordinates or cell indexes rather than
        placeholders. A link to a repository works too.
      render: typescript
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "0.2.1"
    validations:
      required: true

  - type: input
    id: react-native-version
    attributes:
      label: React Native version
      placeholder: "0.87.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - New Architecture
        - Legacy Architecture
        - Not sure
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS
      description: Whether this is a simulator, an emulator or physical hardware is often the whole story.
      placeholder: "iPhone 15 simulator, iOS 18.2 / Pixel 7, Android 15"

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack trace or build output
      description: Paste the relevant part. Native crashes need the logcat or Xcode console output, not the JS error alone.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: >
            I checked the [h3-js divergences](https://github.com/vgorte/react-native-nitro-h3/blob/main/docs/h3-js-divergences.md)
            in case the difference is an intentional one.
          required: true
