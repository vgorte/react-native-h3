name: 🐛 Bug report
description: Report a wrong result, crash, or build failure.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest example that reproduces the issue. A link to a repository is also fine.
      render: typescript
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "0.2.1"
    validations:
      required: true

  - type: input
    id: react-native-version
    attributes:
      label: React Native version
      placeholder: "0.87.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - New Architecture
        - Legacy Architecture
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: >
        Any other versions that might matter, and whether this is a simulator, an emulator or
        physical hardware.
      placeholder: "Expo 53, Hermes, Node 22, Xcode 16.2, iPhone 15 simulator"

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Include relevant Xcode, logcat, or build output if applicable.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I checked the [h3-js divergences](https://github.com/vgorte/react-native-nitro-h3/blob/main/docs/h3-js-divergences.md).
          required: true
