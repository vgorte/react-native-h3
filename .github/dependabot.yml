version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      nitro:
        patterns:
          - "nitrogen"
          - "react-native-nitro-modules"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "h3-js"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "metro"
      - dependency-name: "metro-*"
      - dependency-name: "hermes-compiler"
      # Babel 8 is unreachable while `@react-native/babel-preset` pins `@babel/core` to `^7`.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # TypeScript 7.0 ships no compiler API, which `scripts/gen-api-docs.ts` needs; 7.1 is
      # expected to restore one, so only the 7.0 line is held back.
      - dependency-name: "typescript"
        versions: ["~7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
