name: Harness iOS

on:
  workflow_dispatch:
  # `build-ios.yml` only proves the app links; nothing but a run on a simulator proves the binding
  # returns the right cells, which is what `harness-android.yml` already does for the other platform.
  pull_request:
    paths:
      - 'packages/react-native-nitro-h3/cpp/**'
      - 'packages/react-native-nitro-h3/third_party/**'
      - 'packages/react-native-nitro-h3/nitrogen/generated/**'
      - 'packages/react-native-nitro-h3/src/**'
      - 'packages/react-native-nitro-h3/*.podspec'
      - 'packages/react-native-nitro-h3/nitro.json'
      - 'apps/example/ios/**'
      - 'apps/example/__tests__/**'
      - 'apps/example/src/**'
      - 'apps/example/index.js'
      - 'apps/example/jest.harness.config.mjs'
      - 'apps/example/rn-harness.config.mjs'
      - 'apps/example/package.json'
      - 'bun.lock'
      - 'scripts/device-ios.sh'
      - '.github/workflows/harness-ios.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness_ios:
    name: Harness iOS (${{ matrix.flavor }})
    # Xcode only ships on the macOS runner image, the same reason `build-ios.yml` runs there.
    runs-on: macos-latest
    # `build-ios.yml` is given 60 minutes for pods plus one cold Debug build, and this adds the
    # simulator boot and the suite itself.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # No `tsan`, although the build and the suite are sound under it: a random suite's app
        # relaunch stalls until the bridge timeout in roughly one local run in three (two failures
        # in seven, a different suite each time), and a cold runner is slower than the machine that
        # measured that.
        flavor: [default, asan]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14  # <-- pinned: `latest` turns an upstream release into a red build

      # The Podfile resolves `react_native_pods.rb` through `node -p` and React Native codegen runs
      # inside `pod install`, so Node has to be present and pinned the way `release.yml` pins it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Not the runner's preinstalled Ruby: `Gemfile.lock` carries Bundler 4 checksums that a
      # Bundler 2 cannot read, and the image's own CocoaPods is not the version this project pins,
      # which the pods step installs through.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'  # <-- exact: `Gemfile.lock` records `RUBY VERSION ruby 4.0.6`
          working-directory: apps/example
          bundler-cache: true  # <-- installs the pinned Bundler and gems, and caches them

      # `react-native build-ios` never runs this itself, unlike `pod install` under Expo.
      - run: bun example pods

      # The image's simulator set moves with the Xcode it ships, so the pair pinned in
      # `rn-harness.config.mjs` is only a preference here: the newest runtime carrying it wins, and
      # any other iPhone stands in if the model is gone.
      - name: Select a simulator
        env:
          PREFERRED: iPhone 17 Pro
        run: |
          pair=$(xcrun simctl list devices available --json | jq -r --arg preferred "$PREFERRED" '
            [ .devices
              | to_entries[]
              | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
              | (.key | sub("^.*iOS-"; "") | gsub("-"; ".")) as $version
              | .value[]
              | select(.name | startswith("iPhone"))
              | { name: .name, version: $version }
            ]
            | sort_by([(.name == $preferred), (.version | split(".") | map(tonumber))])
            | last // empty
            | "\(.name) \(.version)"')
          if [ -z "$pair" ]; then
            echo 'This image ships no iPhone simulator:' >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Selected ${pair}"
          echo "H3_IOS_SIMULATOR=${pair% *}" >> "$GITHUB_ENV"
          echo "H3_IOS_RUNTIME=${pair##* }" >> "$GITHUB_ENV"

      # The same script the local runs use, so CI and a developer's machine cannot drift apart on
      # how a flavor is built and installed.
      - name: Run the harness suite
        run: scripts/device-ios.sh ${{ matrix.flavor }}
