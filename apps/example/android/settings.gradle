// Bun links workspace dependencies into each package, not into the repo root, so the plugin
// sits one level up in `apps/example/node_modules` rather than three.
pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'H3Example'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
