buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // matches what the example app resolves; 8.7.2 rejects `compileSdk 36` (AGP 8.9+ accepts it).
    classpath "com.android.tools.build:gradle:9.2.1"
  }
}

// Must stay identical to `react-native-nitro-modules/android/build.gradle`, whose prefab we link
// against: building an ABI that Nitro does not build leaves no `libNitroModules.so` to resolve.
def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'  // <-- compiles nitrogen's `NitroH3OnLoad.kt`

android {
  namespace "com.margelo.nitro.h3"
  compileSdk 36

  // follow the app's NDK, so a library build never downloads a second toolchain
  ndkVersion rootProject.ext.has("ndkVersion") ? rootProject.ext.ndkVersion : "27.1.12297006"

  defaultConfig {
    // follow the app's floor, but never below 24: Nitro builds its prefab from the same `ext`, and
    // prefab rejects a dependency built above the module that links it
    minSdk Math.max(24, (rootProject.ext.has("minSdkVersion") ? rootProject.ext.minSdkVersion : 24).toInteger())
    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -std=c++20"
        // `rootProject` is the app building us through autolinking, so `-Ph3Sanitizer` reaches here
        arguments "-DANDROID_STL=c++_shared",
                  "-DH3_SANITIZER=${rootProject.findProperty('h3Sanitizer') ?: ''}",
                  // 16 KB page alignment on arm64, matching Nitro and mmkv
                  "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true  // <-- the prefabs CMake resolves via find_package
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-nitro-modules')  // <-- the prefab CMake links against
}

// Nitrogen autolinking
apply from: '../nitrogen/generated/android/NitroH3+autolinking.gradle'
