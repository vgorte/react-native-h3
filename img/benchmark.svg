<text class="strong" x="674" y="267" font-size="12" font-weight="600">1,138.6 ms</text>
<text x="24" y="302" font-size="11">Measured on iOS 26.5, Release build, react-native 0.87.0, against h3-js 4.5.0, 2026-08-28.</text>
<text x="24" y="320" font-size="11">Median of 20 runs (3 for polygonToCells) after one warm-up. Bars are scaled per workload.</text>
