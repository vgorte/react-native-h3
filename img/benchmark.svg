<text class="strong" x="674" y="347" font-size="12" font-weight="600">2,020.8 ms</text>
<text x="24" y="382" font-size="11">Measured on Android API 36, Release build, react-native 0.87.0, against h3-js 4.5.0, 2026-08-29.</text>
<text x="24" y="400" font-size="11">Median of 20 runs (3 for polygonToCells) after one warm-up. Bars are scaled per workload.</text>
