<text x="186" y="83" font-size="12" font-weight="600"><tspan class="strong">33.0 ms</tspan><tspan class="factor" dx="10">21× faster</tspan></text>
<text x="144" y="107" font-size="12" text-anchor="end">h3-js</text>
<rect class="reference" x="154" y="94" width="512" height="18" rx="3" fill="#7d8590"/>
<text class="strong" x="674" y="107" font-size="12" font-weight="600">700.5 ms</text>
<text class="strong" x="24" y="142" font-size="14" font-weight="600">polygonToCells, SF, res 12</text>
<text x="144" y="163" font-size="12" text-anchor="end">react-native-h3</text>
<rect x="154" y="150" width="2" height="18" rx="3" fill="#3b82f6"/>
<text x="164" y="163" font-size="12" font-weight="600"><tspan class="strong">76.1 ms</tspan><tspan class="factor" dx="10">269× faster</tspan></text>
<text x="144" y="187" font-size="12" text-anchor="end">h3-js</text>
<rect class="reference" x="154" y="174" width="512" height="18" rx="3" fill="#7d8590"/>
<text class="strong" x="674" y="187" font-size="12" font-weight="600">20,444.3 ms</text>
<text class="strong" x="24" y="222" font-size="14" font-weight="600">cellToBoundary x 100,000</text>
<text x="144" y="243" font-size="12" text-anchor="end">react-native-h3</text>
<rect x="154" y="230" width="50" height="18" rx="3" fill="#3b82f6"/>
<text x="212" y="243" font-size="12" font-weight="600"><tspan class="strong">110.3 ms</tspan><tspan class="factor" dx="10">10× faster</tspan></text>
<text x="144" y="267" font-size="12" text-anchor="end">h3-js</text>
