<text class="strong" x="674" y="187" font-size="12" font-weight="600">31,179.7 ms</text>
<text class="strong" x="24" y="222" font-size="14" font-weight="600">compactCells of a k=20 disk</text>
<text x="144" y="243" font-size="12" text-anchor="end">react-native-nitro-h3</text>
<rect x="154" y="230" width="2" height="18" rx="3" fill="#3b82f6"/>
<text x="164" y="243" font-size="12" font-weight="600"><tspan class="strong">0.085 ms</tspan><tspan class="factor" dx="10">375.6× faster</tspan></text>
<text x="144" y="267" font-size="12" text-anchor="end">h3-js</text>
<rect class="reference" x="154" y="254" width="512" height="18" rx="3" fill="#7d8590"/>
