<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="334" viewBox="0 0 800 334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="react-native-h3 against h3-js, median milliseconds per workload">
<title>react-native-h3 against h3-js, median milliseconds per workload</title>
<style>
text { fill: #727a84 }
