<text x="166" y="163" font-size="12" font-weight="600"><tspan class="strong">231.8 ms</tspan><tspan class="factor" dx="10">134.5× faster</tspan></text>
<text x="144" y="187" font-size="12" text-anchor="end">h3-js</text>
