<text x="250" y="323" font-size="12" font-weight="600"><tspan class="strong">346.6 ms</tspan><tspan class="factor" dx="10">5.8× faster</tspan></text>
<text x="144" y="347" font-size="12" text-anchor="end">h3-js</text>
