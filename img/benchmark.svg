<text x="24" y="382" font-size="11">Measured on iPhone XS (A12 Bionic, 2018), iOS 18.7.9, Release build, react-native 0.87.0, against h3-js 4.5.0, 2026-08-31.</text>
<text x="24" y="400" font-size="11">Median of 20 runs (3 for polygonToCells) after one warm-up. Bars are scaled per workload.</text>
<text x="24" y="418" font-size="11">Source: transcribed from on-device screenshots, raw BENCHMARK_JSON not captured.</text>
