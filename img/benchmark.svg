@media (prefers-color-scheme: light) {
text { fill: #57606a }
.strong { fill: #1f2328 }
.factor { fill: #1f6feb }
.reference { fill: #6e7781 }
}
@media (prefers-color-scheme: dark) {
text { fill: #8b949e }
.strong { fill: #e6edf3 }
.factor { fill: #58a6ff }
.reference { fill: #8b949e }
}
</style>
<text class="strong" x="24" y="32" font-size="17" font-weight="600">react-native-h3 against h3-js, median milliseconds per workload</text>
